# CI: the backend suite on Postgres, the frontend tests and build, and the Docker image started end to end.
# The task kit is not in the repo (task rules), so CI runs without it: every test that reads the kit skips
# ("kit data not present: put the kit in data/"), and the golden-file checks against the kit's sample batch run
# locally only (docs/thursday.md). No secrets and no LLM calls: the tests use a fake model, and the container
# runs with every LLM setting empty.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: corvo
          POSTGRES_PASSWORD: corvo  # a throwaway CI database, not a secret
          POSTGRES_DB: corvo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corvo -d corvo_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://corvo:corvo@localhost:5432/corvo_test
      LLM_MODELS: ""
      LLM_MODEL: ""
      CHAT_LLM: "off"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Backend tests (SQLite and Postgres; tests that read the kit skip)
        run: python -m pytest -q -rf

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build the image and start Postgres and the app
        run: docker compose up --build -d --wait
      - name: Without the kit the container starts, says so, and serves every page
        run: |
          curl -sf http://localhost:8000/api/health | tee health.json
          echo
          grep -q '"kit_loaded":false' health.json
          grep -q 'No kit data loaded' health.json
          curl -sf -o /dev/null http://localhost:8000/
          curl -sf -o /dev/null http://localhost:8000/ops
          curl -sf -o /dev/null http://localhost:8000/kit
      - name: The image contains no kit files
        run: |
          image="$(docker compose images -q app)"
          docker run --rm --entrypoint sh "$image" -c             'test ! -e /app/data && test -z "$(find /app -name item_master.csv -o -name po_history.csv -o -name "RC-*.pdf")"'
      - name: App log
        if: failure()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down -v
