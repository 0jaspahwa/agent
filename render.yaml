# Render blueprint: one Docker web service plus a managed Postgres. See docs/deploy.md.
# Plans: free (Ojas's decision, 17 Nov). The free web service sleeps after 15 minutes idle, so the first request
# after that can take up to a minute (README). A free Postgres expires 30 days after creation: well past review.
services:
  - type: web
    name: corvo-procurement
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false            # deploy deliberately: the commit before Thu 10:00 is the frozen app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corvo-db
          property: connectionString
      - key: SEED_ON_STARTUP
        value: "true"
      - key: RESET_DB_ON_START     # "true" for ONE deploy after a schema change, then back to "false" (docs/deploy.md)
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_MODELS
        value: gemini:gemini-3.6-flash,gemini:gemini-3.5-flash
      - key: DRAFT_MODE
        value: operations
      - key: GEMINI
        sync: false              # the API key: entered in the Render dashboard, never in the repo

databases:
  - name: corvo-db
    databaseName: corvo
    user: corvo
    plan: free
    region: singapore
    postgresMajorVersion: "17"
