# A throwaway Postgres for the test suite (data in memory, port 5433 so it never clashes with the app's db):
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+psycopg://corvo:corvo@localhost:5433/corvo_test pytest
name: cantilai-test
services:
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: corvo
      POSTGRES_DB: corvo_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvo -d corvo_test"]
      interval: 2s
      timeout: 3s
      retries: 30
